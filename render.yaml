services:
  - type: web
    name: technova-electronics-iot
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: render_com
